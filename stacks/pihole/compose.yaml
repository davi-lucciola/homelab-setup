services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8053:80/tcp"
    environment:
      TZ: "America/Sao_Paulo"
      FTLCONF_webserver_api_password: "${PIHOLE_PASSWORD:-admin}"
      FTLCONF_dns_listeningMode: "ALL"
      FTLCONF_dns_domain_name: "homelab.internal"
      FTLCONF_misc_dnsmasq_lines: "address=/homelab.internal/${HOMELAB_IP:-192.168.15.42}"
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`pihole.homelab.internal`)"
      - "traefik.http.routers.pihole.entrypoints=web"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"

networks:
  proxy: {}
