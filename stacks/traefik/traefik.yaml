# Configurações de logs
log:
  level: INFO

# Pontos de entrada de tráfego
entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

# Integração automática com o Docker Engine
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false # Exige label 'traefik.enable=true' para expor o container
    network: proxy

# Dashboard só via router com middleware (sem api.insecure / :8080)
api:
  dashboard: true
  insecure: false
