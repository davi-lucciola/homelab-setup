services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:80:80"
      - "${HOMELAB_IP}:80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./.htpasswd:/etc/traefik/.htpasswd:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.middlewares.homelab-lan.ipallowlist.sourcerange=${HOMELAB_LAN_CIDR},127.0.0.1/32"
      - "traefik.http.middlewares.homelab-auth.basicauth.usersfile=/etc/traefik/.htpasswd"
      - "traefik.http.middlewares.homelab-secure.chain.middlewares=homelab-lan,homelab-auth"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.homelab.internal`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=web"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=homelab-secure"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M

networks:
  proxy:
    name: proxy
    external: true
